
name: Keep Render Backend Alive

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 20 \
            --max-time 120 \
            https://customer-churn-api-v4kk.onrender.com/health
