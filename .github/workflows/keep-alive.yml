name: Keep Render Backend Alive

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          curl --fail --silent --show-error \
            https://customer-churn-api-v4kk.onrender.com/health